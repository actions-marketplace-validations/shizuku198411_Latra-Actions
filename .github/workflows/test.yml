name: Test Latra Action
on: [push, pull_request]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare a project without suppression rules
        run: |
          mkdir testdata/unsuppressed
          cp -R testdata/workshop/{workshop.yaml,.workshop} testdata/unsuppressed/
      - name: Scan without a threshold
        uses: ./
        with:
          project: testdata/unsuppressed
      - name: Fail on the demo SDK
        id: gate
        uses: ./
        continue-on-error: true
        with:
          project: testdata/unsuppressed
          fail-on: 'risk>0'
      - name: Verify the failure and the matched SDK
        shell: bash
        run: |
          test '${{ steps.gate.outcome }}' = failure
          # GitHub provides a different summary file to each step.
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/latra-match.md"
          status=0
          snap run latra scan --project testdata/unsuppressed --fail-on 'risk>0' || status=$?
          test "$status" -eq 1
          grep -F '1 of 1 SDKs matched' "$GITHUB_STEP_SUMMARY"
          grep -E '  demo  [0-9]+/100' "$GITHUB_STEP_SUMMARY"
      - name: Pass after suppression
        uses: ./
        with:
          project: testdata/workshop
          fail-on: 'risk>0'
      - name: Verify the suppressed SDK was evaluated
        run: |
          export GITHUB_STEP_SUMMARY="$RUNNER_TEMP/latra-pass.md"
          snap run latra scan --project testdata/workshop --fail-on 'risk>0'
          grep -F '1 SDKs evaluated' "$GITHUB_STEP_SUMMARY"
